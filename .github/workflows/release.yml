# Release Workflow with Changesets
#
# Uses Changesets to automate versioning and publishing to npm.
# Supports npm Trusted Publishers (OIDC) for secure, token-free publishing.
#
# How it works:
# 1. On push to master, Changesets creates a "Version Packages" PR
# 2. When that PR is merged, packages are automatically published to npm
# 3. GitHub releases are created automatically
#
# Setup — npm Trusted Publishers (OIDC):
# 1. Enable "Trusted Publishers" on your npm package settings page
# 2. Add GitHub Actions as trusted publisher (repo + workflow: release.yml)
# 3. No NPM_TOKEN needed!
#
# Fallback: set NPM_TOKEN in repository secrets for token-based auth.

name: Release

on:
  push:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Create releases and tags
      pull-requests: write  # Create version PRs
      id-token: write       # Required for OIDC trusted publishers

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Generate changeset for runtime dependency updates
        # Dependabot PRs get no changeset, so runtime dependency bumps would never be released
        run: |
          base=$(git log -1 --format=%H --grep='^chore: version packages' HEAD)
          if [ -z "$base" ]; then echo "No previous release commit found; skipping"; exit 0; fi
          q='{d:(.dependencies//{}),o:(.optionalDependencies//{}),p:(.peerDependencies//{})}'
          pkgs=""
          for f in $(git ls-files '*package.json'); do
            case "$f" in *node_modules*) continue;; esac
            [ "$(jq -r '.private // false' "$f")" = "true" ] && continue
            name=$(jq -r '.name // empty' "$f"); [ -z "$name" ] && continue
            old=$(git show "$base:$f" 2>/dev/null | jq -S -c "$q" 2>/dev/null) || continue
            [ -z "$old" ] && continue
            new=$(jq -S -c "$q" "$f")
            [ "$old" != "$new" ] && pkgs="$pkgs $name"
          done
          echo "Release base: ${base:0:7}; packages with runtime dependency changes:${pkgs:- none}"
          if [ -n "$pkgs" ]; then
            { echo '---'; for p in $pkgs; do echo "\"$p\": patch"; done; echo '---'; echo; echo '- chore(deps): update runtime dependencies'; } > ".changeset/deps-runtime-$(date +%s).md"
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Enable auto-merge on version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:changeset-release/${context.ref.replace('refs/heads/', '')}`
            });
            if (pulls.length === 0) { console.log('No version PR found'); return; }
            const pr = pulls[0];
            try {
              await github.graphql(`
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: MERGE }) {
                    pullRequest { number }
                  }
                }
              `, { id: pr.node_id });
              console.log(`Auto-merge enabled on PR #${pr.number}`);
            } catch(e) {
              console.log('Auto-merge not available:', e.message);
            }
